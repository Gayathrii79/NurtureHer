<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7C3AED" />
    <title>Offline — NurtureHer AI</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8f7fc;
        color: #1e1b2e;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
      }
      main {
        max-width: 420px;
        text-align: center;
      }
      .heart {
        font-size: 44px;
        line-height: 1;
      }
      h1 {
        font-size: 22px;
        margin: 12px 0 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #5b5670;
        margin: 0 0 10px;
      }
      strong {
        color: #7c3aed;
      }
      button {
        margin-top: 14px;
        border: 0;
        border-radius: 999px;
        background: #7c3aed;
        color: #fff;
        font-weight: 700;
        font-size: 14px;
        padding: 10px 22px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="heart" aria-hidden="true">💜</div>
      <h1>You are offline</h1>
      <p>This screen has not been loaded yet, so it needs a connection the first time you open it.</p>
      <p>
        The last wellness dashboard you loaded stays readable offline, but saving new entries needs a
        connection.
      </p>
      <p><strong>The AI health coach needs an internet connection</strong> — chat is unavailable offline.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
